# Local PostgreSQL for word packs and anonymous analytics.
#   docker compose up -d
#   DATABASE_URL=postgres://khuuramch:khuuramch@localhost:5432/khuuramch
# Port 5432 taken by another Postgres? POSTGRES_PORT=55432 docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: khuuramch
      POSTGRES_USER: khuuramch
      POSTGRES_PASSWORD: khuuramch
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U khuuramch -d khuuramch']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
